<div class="app-body">

    <app-sidebar style="background: #646E7A !important; margin-top: -1px !important;" [fixed]="true" [display]="'lg'" [minimized]="minimized" #sidebar
        (minimizedChange)="toggleMinimize($event)" >
        <img  src="assets/img/profluent-logo-2.png"  >
        
        <app-sidebar-nav [navItems]="navItems" ></app-sidebar-nav>
        <!-- <app-sidebar-minimizer></app-sidebar-minimizer> -->
    </app-sidebar>
    <!-- Main content -->
    <main class="main">
        <div class="row">

       <div class="col-7 " style="padding-right: 0px !important;">

      
        <!-- Breadcrumb -->
        <cui-breadcrumb>
            <!-- Breadcrumb Menu-->
            
        </cui-breadcrumb>
         </div>
         <div class="col-5 breadcrumb" style="padding-left: 0px !important; display: inline !important;">
                <div style="float: right !important; margin-right: 5%; "> 
                    <span id="compnamedis" style="color: #454545; font-weight: bold;"></span>&nbsp;&nbsp;
                <a href="javascript:void(0)" style="color: #454545;
    text-decoration: none;
    font-size: 14px;" >
               <i class="fa fa-user"></i> <b> {{profilename}}</b>&nbsp;
            </a>
            <a title="Logout"  style="color: #454545;
    text-decoration: none;
    font-size: 14px;"  href="javascript:void(0)" (click)="logOutPop(logOutPopup)"><i class="fa fa-sign-out"></i></a></div>
         </div>
         </div>
        <div class="container-fluid">
            <router-outlet>
               
                <app-spinner></app-spinner>
            </router-outlet>
        </div>
    </main>
    <!-- <app-aside [fixed]="true" [display]="false">
    </app-aside> -->
</div>
<span id="triggerPopupModal" (click)="confirmModal.show()"></span>
<div bsModal #confirmModal="bs-modal" class="modal fade" id="exampleModalCenter" tabindex="-1" role="dialog"
    aria-labelledby="exampleModalCenterTitle" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content cases-model">

            <div class="modal-body">
                <h5 class="modal-title" id="exampleModalLongTitle">Change Status</h5>

                <h6> Are you sure! Do you want to Change Status? </h6>
            </div>
            <div class="modal-footer">

                <button type="button" class="btn conform-dels" (click)="confirmPopunModal();confirmModal.hide();">
                    Yes
                </button>
                <button type="button" class="btn conform-cancel" (click)="confirmModal.hide()">
                    No
                </button>
            </div>
        </div>
    </div>
</div>
<app-footer style="margin-top: 55px !important;">
    <span class="ml-auto"><a href="javascript:void(0)">Copyright {{settings ? settings.site_title : ''}}</a> &copy;
        <!-- {{currentDate
        | date:"yyyy" }} -->
        2025 Profluent Labs.</span>
</app-footer>

<ng-template #logOutPopup>
    <div class="logout_modal">

        <div class="modal-body login-body">
            <div class="h4_close">
                <h4>Logout</h4>
                <div (click)="destroyPopup()" style="cursor: pointer;" title="close the popup" class="pop_cls_btn">
                    &#10006;
                </div>
            </div>
            <h6 class="modal-title">Are you sure you want to logout?</h6>
        </div>
        <div class="modal-footer border-0">
            <button type="button" (click)="destroyPopup()" class="btn cancel-btn">Cancel</button>
            <button type="button" (click)="logout()" class="btn btn-success">Logout</button>
           
        </div>
    </div>
</ng-template>
